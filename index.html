<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Messenger</title>
  <link rel="stylesheet" href="styles.css?v=1.0.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%232aabee'/><path d='M17.5 7.5L5.5 12.2l3.4 1.3 1.3 4.1 2.3-2.1 3.5 2.6L18 7.3z' fill='%23ffffff'/></svg>">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-wrapper">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-logo">🌐</div>
          <h1>Global Messenger</h1>
          <p class="subtitle">Быстрый и чистый мессенджер</p>
        </div>

        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn active">Вход</button>
          <button id="tab-register" class="tab-btn">Регистрация</button>
        </div>

        <form id="auth-form" class="auth-form">
          <div class="input-group">
            <label for="auth-username">Имя пользователя</label>
            <input type="text" id="auth-username" placeholder="@username" required autocomplete="username">
          </div>

          <div class="input-group">
            <label for="auth-password">Пароль</label>
            <input type="password" id="auth-password" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="auth-submit-btn" class="btn primary-btn full-width">
            Войти в систему
          </button>
        </form>

        <div id="auth-status" class="status-msg"></div>

        <div class="cloud-info">
          <span id="storage-mode-badge">⚡ Режим: Локальный (быстрый оффлайн-старт)</span>
        </div>
      </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-screen" class="main-wrapper hidden">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
          <div class="user-profile">
            <div class="avatar" id="current-user-avatar">?</div>
            <div class="user-meta">
              <div class="name" id="current-user-name">Загрузка...</div>
              <div class="status-badge online">В сети</div>
            </div>
          </div>
          <div class="header-actions">
            <button id="btn-logout" class="icon-btn" title="Сменить аккаунт / Выйти">🚪</button>
          </div>
        </header>

        <!-- SEARCH INPUT -->
        <div class="search-box">
          <div class="search-input-wrap">
            <svg class="search-svg-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="chat-search" placeholder="Поиск людей по @username..." autocomplete="off">
            <button id="btn-search-clear" class="search-clear-btn hidden" title="Очистить поиск">✕</button>
          </div>
        </div>

        <!-- SEARCH RESULTS -->
        <div class="search-results-section hidden" id="search-results-section">
          <div class="sidebar-section-header">
            <span class="sidebar-section-title">Результаты поиска</span>
          </div>
          <div class="search-results-list" id="search-results-list"></div>
        </div>

        <!-- CHAT LIST -->
        <div class="chat-list" id="chat-list"></div>
      </aside>

      <!-- INNER CHAT VIEW -->
      <main class="chat-view">
        <header class="chat-header">
          <button id="btn-back" class="icon-btn mobile-only">←</button>
          <div class="chat-header-info">
            <div class="chat-header-avatar" id="active-chat-avatar">🌐</div>
            <div class="chat-header-text">
              <h2 id="active-chat-title">Общий чат</h2>
              <span class="chat-status" id="active-chat-status">в сети</span>
            </div>
          </div>
        </header>

        <!-- MESSAGES CONTAINER -->
        <div class="messages-container" id="messages-container">
          <div class="msg-feed" id="messages-feed"></div>
        </div>

        <!-- COMPOSER -->
        <footer class="tg-composer">
          <input type="file" id="file-input" style="display: none">
          
          <button id="btn-attach" class="tg-clip-btn" title="Прикрепить фото или файл">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 0 0 6 0V5a4 4 0 0 0-8 0v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
            </svg>
          </button>

          <div class="tg-input-pill">
            <textarea id="message-input" placeholder="Написать сообщение..." rows="1"></textarea>
          </div>

          <button id="btn-send" class="tg-airplane-btn" title="Отправить">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </footer>
      </main>
    </div>
  </div>

  <script src="config.js?v=1.0.0"></script>
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
